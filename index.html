<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>名片夾 CardVault</title>
  <meta name="description" content="名片夾（CardVault）：離線名片掃描 App，資料完全留在你的手機。">
  <style>
    :root {
      --brand-deep: #16224a; --brand: #3557a8; --brand-light: #7fb0e6;
      --tint: #eef2fb; --ink: #14182a; --muted: #5b6178; --hairline: #e2e7f5;
      --bg: #ffffff; --hero-text: #eef2fb; --hero-muted: #aebbe0; --card: #ffffff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --brand-deep: #0c1224; --brand: #7fa6e8; --brand-light: #9dc6f2;
        --tint: #161d38; --ink: #eef1fa; --muted: #a6acc4; --hairline: #262f52;
        --bg: #0c1224; --hero-text: #eef2fb; --hero-muted: #8f9dc7; --card: #141d33;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
      line-height: 1.8; -webkit-font-smoothing: antialiased;
    }
    .hero { background: var(--brand-deep); color: var(--hero-text); padding: 40px 24px 72px; }
    .container { max-width: 720px; margin: 0 auto; }
    .hero-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 64px; }
    .app-badge { display: inline-flex; align-items: center; gap: 12px; font-weight: 700; font-size: 19px; }
    .app-badge img { width: 40px; height: 40px; border-radius: 10px; display: block; }
    .lang-switch {
      font-size: 14px; font-weight: 600; color: var(--hero-muted); text-decoration: none;
      border: 1px solid currentColor; border-radius: 999px; padding: 5px 14px; opacity: 0.9;
    }
    .hero h1 { font-size: clamp(30px, 6vw, 46px); line-height: 1.3; margin: 0 0 16px; font-weight: 500; }
    .hero h1 strong { font-weight: 800; }
    .hero p { font-size: 17px; color: var(--hero-muted); margin: 0; max-width: 460px; }
    .links { max-width: 720px; margin: -40px auto 0; padding: 0 24px 64px; display: grid; gap: 16px; }
    @media (min-width: 560px) { .links { grid-template-columns: 1fr 1fr; } }
    .nav-card {
      background: var(--card); border: 1px solid var(--hairline); border-radius: 16px;
      padding: 24px; text-decoration: none; color: var(--ink); display: block;
    }
    .nav-card:hover { border-color: var(--brand); }
    .nav-card .k { font-size: 13px; font-weight: 600; letter-spacing: 0.06em; color: var(--brand); margin: 0 0 6px; }
    .nav-card h2 { font-size: 20px; font-weight: 700; margin: 0 0 6px; }
    .nav-card p { font-size: 14px; color: var(--muted); margin: 0; }
    footer { text-align: center; color: var(--muted); font-size: 14px; padding: 8px 24px 48px; }
  </style>
</head>
